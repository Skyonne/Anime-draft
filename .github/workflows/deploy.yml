name: Validate and deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run validate:data
      - run: npm run test -- --run
      - name: Download character portraits for the published site
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run portraits:download
      - name: Configure deployment path
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/$repo/" >> "$GITHUB_ENV"
          fi
      - name: Build the published game
        run: npm run build
        env:
          VITE_REMOTE_PORTRAITS: 'true'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
